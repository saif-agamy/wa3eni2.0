{% extends 'index.html' %}

{% block content %}
<head>    
    <link rel="stylesheet" href="{{url_for('community.static', filename='css/style.css')}}">
</head>

<div class="container">
    <div class="card create-card shadow-sm">
        <div class="card-header border-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
            <h5 class="fw-bold mb-0" style="color: #0d6efd;">أنشئ أختباراً</h5>
            <a href="/" class="btn-close" aria-label="Close"></a>
        </div>
        
        <div class="card-body">
            <form method="POST">
                {{ exam_form.hidden_tag() }}

                <div class="d-flex align-items-center mb-3">
                    <span class="fw-semibold text-black">المسابقة الرمضانية 2026</span>
                </div>  

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">اليوم</label>
                    {{ exam_form.day(class="form-select border-0 bg-light py-2") }}
                </div>

                <div class="mb-4">
                    <label class="form-label small fw-bold text-muted">التصنيف</label>
                    {{ exam_form.category(class="form-select border-0 bg-light py-2") }}
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-bold py-2 rounded-pill shadow-sm">
                    انشيء
                </button>
            </form>
        </div>
    </div>
</div>

<script>
    function updatePreview() {
        const url = document.getElementById('imageUrl').value;
        const previewBox = document.getElementById('imagePreview');
        const placeholder = document.getElementById('previewPlaceholder');
        
        if (url) {
            previewBox.innerHTML = `<img src="${url}" onerror="this.src='https://placehold.co/600x400?text=Invalid+Image+URL'">`;
        } else {
            previewBox.innerHTML = `
                <div class="text-center text-muted" id="previewPlaceholder">
                    <i class="bi bi-image fs-1"></i>
                    <p>Image Preview will appear here</p>
                </div>`;
        }
    }
</script>
{% endblock %}
