{% extends "index.html" %}

{% block content %}
<head>
    <link rel="stylesheet" href="{{url_for('community.static', filename='css/style.css')}}">
    <style>
        body { background-color: #e7ac74; font-family: 'Inter', sans-serif; }
        .detail-container { max-width: 800px; margin-top: 30px; }
        .post-full-img { width: 100%; border-radius: 20px; max-height: 500px; object-fit: cover; }
        .comment-section { background-color: #d58e4c; border-radius: 20px; padding: 25px; margin-top: 40px; }
        .avatar-comment { width: 35px; height: 35px; border-radius: 50%; }
        .comment-bubble { background: #325caf; padding: 10px 15px; border-radius: 15px; display: inline-block; }
    </style>
</head>

<div class="container detail-container">
    <a href="{{url_for('community.blog')}}" style="color: #325caf;" class="text-decoration-none mb-4 d-inline-block">
        <i class="bi bi-arrow-left" style="color: #325caf;"></i> Back to Feed
    </a>

    <!-- author details -->
    <div class="d-flex align-items-center mb-4">
        <img src="{{url_for('auth.static',filename='media/'+user.icon)}}" class="rounded-circle me-3" width="50">
        <div>
            <h6 class="mb-0 fw-bold">{{user.username}}</h6>
            <small class="text-muted">{{ post.date.strftime('%b %d, %Y') }}</small>
        </div>
    </div>

    <!-- title -->
    <h1 class="fw-bold mb-3" style="color: #325caf;">{{ post.title }}</h1>
    <span class="badge bg-primary-subtle text-primary mb-4">{{ post.flag }}</span>

    <!-- content -->
    <div class="fs-5 text-dark lh-base mb-5 text-white" style="white-space: pre-wrap;">
        {{ post.content }}
    </div>

    <hr>

    <!-- comments -->
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
