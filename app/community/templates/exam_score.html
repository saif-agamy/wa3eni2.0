{% extends 'index.html' %}

{% block content %}
    <head>
        <link rel="stylesheet" href="{{url_for('community.static', filename='css/style.css')}}">
    </head>

    <div class="container-fluid">
        <div class="row">
            <div class="container-fluid d-flex justify-content-center">
                <h1 class="fw-bold display-1 score-username">{{current_user.username}}</h1>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-lg-6 col-sm-12 mt-3">
                <h3 class="display-6 fw-bold text-white" dir="rtl">نقاطك في أسئلة اليوم</h3>
                <div class="container-fluid score-info d-flex justify-content-center">
                        <h3 class="display-3" dir="rtl">({{exam.score}}) نقاط</h3>
                </div>
            </div>
            <div class="col-lg-6 col-sm-12 mt-3">
                <h3 class="display-6 fw-bold text-white" dir="rtl">الوقت المستغرق لحل أسئلة اليوم</h3>
                <div class="container-fluid score-info d-flex justify-content-center">
                    <h3 class="display-3" dir="rtl">({{exam.time}}) ثانية</h3>               
                </div>
            </div>
        </div>
        <div class="row mt-5">
            <div class="col-lg-6 col-sm-12 mt-3">
                <div class="container-fluid d-flex justify-content-center">
                    <a href="{{url_for('community.leader_board')}}" class="score-btn p-2 fs-2">الذهاب للمراكز</a>
                </div>
            </div>
            <div class="col-lg-6 col-sm-12 mt-3">
                <div class="container-fluid d-flex justify-content-center">
                    <a href="{{url_for('community.ramadan_comp')}}" class="score-btn p-2 fs-2">الذهاب للصفحة الرئيسية</a>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
